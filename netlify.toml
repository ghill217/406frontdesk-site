# Netlify build + hosting config for the 406 Front Desk site.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# The .netlify.app→406frontdesk.com force-301 lives in src/_redirects — domain-level
# rules never fire from netlify.toml (verified 2026-08-09), only from _redirects.

# Security + caching headers (helps Performance + best-practices audits)
# Functions. Declared explicitly rather than relying on the default path: this site
# had no functions until /build-brief/, and `functions_dir` is unset on the Netlify
# side, so leaving it implicit means the submit endpoint's existence depends on a
# convention nothing here states. esbuild is named for the same reason -- the function
# uses ESM and a JSON import attribute.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # microphone=self is required by the GHL voice web-call widget (runs in-page, not an iframe);
    # the two leadconnectorhq origins cover a future iframe-based call flow.
    Permissions-Policy = "geolocation=(), microphone=(self \"https://widgets.leadconnectorhq.com\" \"https://services.leadconnectorhq.com\"), camera=()"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
